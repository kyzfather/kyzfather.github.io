<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <main class="max-w-3xl mx-auto px-4 py-12">
        <!-- Personal Info -->
        <section class="flex flex-col items-center">
            <!-- Photo placeholder -->
            <div class="w-32 h-32 rounded-full bg-gray-200 border-2 border-gray-300 flex items-center justify-center text-gray-500">
                Your Photo
            </div>
            <!-- GitHub and Email icons -->
            <div class="flex gap-4 mt-4">
                <a href="#" class="text-gray-600 hover:text-gray-900" aria-label="GitHub">
                    <!-- GitHub SVG -->
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48 0-.24-.01-.87-.01-1.71-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1.01.07 1.54 1.04 1.54 1.04.9 1.54 2.36 1.1 2.94.84.09-.65.35-1.1.63-1.35-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85 0 1.34-.01 2.42-.01 2.75 0 .27.18.58.69.48C19.13 20.17 22 16.42 22 12c0-5.52-4.48-10-10-10z" clip-rule="evenodd"/>
                    </svg>
                </a>
                <a href="#" class="text-gray-600 hover:text-gray-900" aria-label="Email">
                    <!-- Email SVG -->
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                </a>
            </div>
        </section>

        <!-- About Me -->
        <section class="mt-12">
            <h2 class="text-2xl font-bold mb-4">About Me</h2>
            <p class="text-gray-700 leading-relaxed">
                Your introduction goes here. Describe yourself, your interests, and what you do.
            </p>
            <div class="mt-6">
                <h3 class="text-lg font-semibold mb-2">Tech Stack</h3>
                <p class="text-gray-600">
                    Your tech stack placeholder: e.g., JavaScript, Python, React, Node.js, etc.
                </p>
            </div>
        </section>
    </main>
</body>
</html>
